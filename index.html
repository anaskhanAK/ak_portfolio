    <script>
      // Apply the theme before first paint (saved choice, else the system setting) to avoid a flash.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111315')
      })()
    </script>
