server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build output never changes, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Older nginx mime.types lack AVIF; serve the hero portrait with the right type.
    location ~* \.avif$ {
        types { }
        default_type image/avif;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Always revalidate the page so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Case studies use hash routes (#/work/<slug>), so everything else is a plain file lookup.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
